: "24", "中文名稱": "遠程通訊", "英文名稱": "telecommunication", "中文定義": "書本指出，遠程通訊的進步提高了資訊的流動性和覆蓋面。", "英文定義": "The book states that advances in telecommunication have increased the mobility and coverage of information."}, {"工作表名稱": "A1_資訊處理", "課文編號": 1, "課文名稱": "資訊處理簡介", "課文章節編號": "1.4", "課文章節名稱": "資訊時代", "首次出現頁數": 20, "主要講解頁數": "20", "其他相關頁數": null, "中文名稱": "視像串流", "英文名稱": "video streaming", "中文定義": "書本指出，5G 流動網絡使數據能在多個流動設備之間穩定而高效地傳輸，並有利於視像串流的發展。", "英文定義": "The book states that 5G mobile networks allow data to be transmitted stably and efficiently between multiple mobile devices, supporting the development of video streaming."}, {"工作表名稱": "A1_資訊處理", "課文編號": 1, "課文名稱": "資訊處理簡介", "課文章節編號": "1.4", "課文章節名稱": "資訊時代", "首次出現頁數": 20, "主要講解頁數": "20", "其他相關頁數": "24", "中文名稱": "物聯網", "英文名稱": "Internet of Things (IoT)", "中文定義": "物聯網（IoT）是不同物件之間的網絡；物聯網所收集的數據可在設備之間交換，以達到不同的用途。", "英文定義": "The Internet of Things (IoT) is a network of different objects; data collected by the IoT can be exchanged between devices for different purposes."}, {"工作表名稱": "A1_資訊處理", "課文編號": 1, "課文名稱": "資訊處理簡介", "課文章節編號": "1.4", "課文章節名稱": "資訊時代", "首次出現頁數": 20, "主要講解頁數": "20", "其他相關頁數": null, "中文名稱": "加速度計", "英文名稱": "accelerometer", "中文定義": "書本以手機中的加速度計作為物聯網所涉及的小型物件例子。", "英文定義": "The book uses an accelerometer in a mobile phone as an example of a small object that can be involved in the Internet of Things."}, {"工作表名稱": "A1_資訊處理", "課文編號": 1, "課文名稱": "資訊處理簡介", "課文章節編號": "1.4", "課文章節名稱": "資訊時代", "首次出現頁數": 21, "主要講解頁數": "21", "其他相關頁數": "24", "中文名稱": "大數據", "英文名稱": "big data", "中文定義": "因為數碼設備與網上平台的高使用率而收集回來的大量數據，稱為「大數據」。", "英文定義": "The large amount of data collected as a result of the high usage of digital devices and online platforms is called big data."}, {"工作表名稱": "A1_資訊處理", "課文編號": 1, "課文名稱": "資訊處理簡介", "課文章節編號": "1.4", "課文章節名稱": "資訊時代", "首次出現頁數": 21, "主要講解頁數": "21", "其他相關頁數": "24", "中文名稱": "人工智能", "英文名稱": "artificial intelligence (AI)", "中文定義": "人工智能（AI）可在短時間內處理和分析大量數據，並可透過深度學習不斷自行精進。", "英文定義": "Artificial intelligence (AI) can process and analyse large amounts of data in a short time and can continually improve itself through deep learning."}, {"工作表名稱": "A1_資訊處理", "課文編號": 1, "課文名稱": "資訊處理簡介", "課文章節編號": "1.4", "課文章節名稱": "資訊時代", "首次出現頁數": 22, "主要講解頁數": "22", "其他相關頁數": "24", "中文名稱": "資訊素養", "英文名稱": "information literacy", "中文定義": "在接受和使用資訊之前，我們應先考慮資訊素養的不同層面，包括知識產權、數據私隱、可信度，以及提取和組織資訊。", "英文定義": "Before accepting and using information, we should consider different aspects of information literacy, including intellectual property, data privacy, credibility, and the extraction and organisation of information."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 30, "主要講解頁數": "30", "其他相關頁數": "31, 52–54", "中文名稱": "數據分級", "英文名稱": "data hierarchy", "中文定義": "數據可按層級組織；書本以欄、記錄／列、檔案／數據表和數據庫等層級說明數據分級。", "英文定義": "Data can be organised into levels; the book explains data hierarchy using levels such as fields, records/rows, files/tables, and databases."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 31, "主要講解頁數": "53", "其他相關頁數": null, "中文名稱": "欄", "英文名稱": "field", "中文定義": "欄用來儲存每項記錄的一種資料屬性；數據庫結構會決定欄位的數據類型。", "英文定義": "A field stores one type of data attribute for each record; the database structure determines the data type of a field."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 31, "主要講解頁數": "31", "其他相關頁數": "53", "中文名稱": "記錄／列", "英文名稱": "record", "中文定義": "一條記錄由多個相關欄位組成，用來描述一個實體的一組資料。", "英文定義": "A record consists of multiple related fields and represents a set of data describing one entity."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 31, "主要講解頁數": "31", "其他相關頁數": "53", "中文名稱": "檔案／數據表", "英文名稱": "file / table", "中文定義": "檔案／數據表由多條相關記錄組成。", "英文定義": "A file/table consists of multiple related records."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 31, "主要講解頁數": "31", "其他相關頁數": "44–47, 50–51, 53–55", "中文名稱": "數據庫", "英文名稱": "database", "中文定義": "數據庫可包含多個相關的檔案／數據表，並用來組織、儲存和提取數據。", "英文定義": "A database can contain multiple related files/tables and is used to organise, store, and retrieve data."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 31, "主要講解頁數": "31", "其他相關頁數": "46, 53", "中文名稱": "數據庫管理系統", "英文名稱": "database management system (DBMS)", "中文定義": "數據庫管理系統用來管理數據庫，讓用戶組織、儲存、修改及提取數據。", "英文定義": "A database management system is used to manage a database, allowing users to organise, store, modify, and retrieve data."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.1", "課文章節名稱": "數據分級", "首次出現頁數": 31, "主要講解頁數": "53", "其他相關頁數": null, "中文名稱": "圖形用戶界面", "英文名稱": "graphical user interface (GUI)", "中文定義": "書本指出，用戶可使用圖形用戶界面（GUI）在數據庫中插入新記錄、更改或刪除現有記錄。", "英文定義": "The book states that users can use a graphical user interface (GUI) to insert new records into a database and modify or delete existing records."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.2", "課文章節名稱": "數據控制", "首次出現頁數": 32, "主要講解頁數": "33", "其他相關頁數": "34–44, 46, 48, 50, 52–54", "中文名稱": "數據控制", "英文名稱": "data control", "中文定義": "數據控制用來減少錯誤數據進入系統，書本以數據有效性檢驗和數據驗證／數據校驗作為兩種主要方式。", "英文定義": "Data control is used to reduce incorrect data entering a system; the book presents data validation and data verification as two main methods."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.2", "課文章節名稱": "數據控制", "首次出現頁數": 33, "主要講解頁數": "33", "其他相關頁數": "53", "中文名稱": "無用輸入，無用輸出", "英文名稱": "garbage in, garbage out (GIGO)", "中文定義": "「無用輸入，無用輸出」指出，如果輸入的數據不正確，即使處理程序正確，輸出的結果亦會不可靠。", "英文定義": "Garbage in, garbage out (GIGO) means that if the input data is incorrect, the output will also be unreliable even when the processing is correct."}, {"工作表名稱": "A1_資訊處理", "課文編號": 2, "課文名稱": "數據控制及數據組織", "課文章節編號": "2.2", "課文章節名稱": "數據控制", "首次出現頁數": 33, "主要講解頁數": "33–34", "其他相關頁數": "35, 37, 41– ised and stored in a file; properly changing a file format requires exporting with editing software or using file-conversion software."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 101, "主要講解頁數": "101–102", "其他相關頁數": "103–104, 108, 113–115, 118–122, 124–125, 127", "中文名稱": "壓縮", "英文名稱": "compression", "中文定義": "壓縮用來減少表示同一數據所需的儲存空間。", "英文定義": "Compression is used to reduce the amount of storage space required to represent the same data."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 101, "主要講解頁數": "101", "其他相關頁數": "102–103, 113, 115, 118, 124–125", "中文名稱": "無損壓縮", "英文名稱": "lossless compression", "中文定義": "無損壓縮在壓縮後保留所有原始數據，解壓縮後可以還原原本的內容。", "英文定義": "Lossless compression preserves all original data, allowing the original content to be restored after decompression."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 102, "主要講解頁數": "102", "其他相關頁數": "103–104, 113, 115, 118, 124–125", "中文名稱": "有損壓縮", "英文名稱": "lossy compression", "中文定義": "有損壓縮會移除部分數據以減少檔案大小，因此壓縮後的品質可能下降。", "英文定義": "Lossy compression removes some data to reduce file size, so quality may decrease after compression."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 105, "主要講解頁數": "105", "其他相關頁數": "106–107, 124–127", "中文名稱": "文本", "英文名稱": "text", "中文定義": "文本包括各種類型的字符；多媒體部分進一步按純文字和格式化文本等形式討論文本檔案。", "英文定義": "Text consists of different types of characters; the multimedia section further discusses text files in forms such as plain text and formatted text."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 105, "主要講解頁數": "105", "其他相關頁數": "106, 125", "中文名稱": "純文字", "英文名稱": "plain text", "中文定義": "純文字只會儲存字符，不會儲存字型、字體大小、顏色等格式資料。", "英文定義": "Plain text stores characters only and does not store formatting information such as font, font size, or colour."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 105, "主要講解頁數": "105", "其他相關頁數": "106, 125", "中文名稱": "格式化文本", "英文名稱": "formatted text", "中文定義": "格式化文本會儲存字符及其格式資料，如字型、字體大小、字體顏色、行距和對齊方式等。", "英文定義": "Formatted text stores characters together with formatting information such as font, font size, font colour, line spacing, and alignment."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 108, "主要講解頁數": "109", "其他相關頁數": "110–114, 119–120, 125", "中文名稱": "圖像", "英文名稱": "image", "中文定義": "數碼圖像是由數碼相機捕捉或使用圖像編輯軟件製作的圖像。", "英文定義": "A digital image is an image captured by a digital camera or created using image-editing software."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 108, "主要講解頁數": "108", "其他相關頁數": "109, 113, 124–125", "中文名稱": "點陣圖", "英文名稱": "bitmap image", "中文定義": "點陣圖會儲存為一系列稱為像素的小正方形，每個像素獲分配一個二進制數字以表示其顏色。", "英文定義": "A bitmap image is stored as a series of small squares called pixels, with each pixel assigned a binary number representing its colour."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 108, "主要講解頁數": "108", "其他相關頁數": "110–111, 113, 125, 127", "中文名稱": "像素", "英文名稱": "pixel", "中文定義": "像素是組成點陣圖的小正方形，每個像素可用二進制數字表示其顏色。", "英文定義": "A pixel is a small square that makes up a bitmap image, and its colour can be represented by a binary number."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 109, "主要講解頁數": "109", "其他相關頁數": "113–114, 124–125", "中文名稱": "向量圖", "英文名稱": "vector image", "中文定義": "向量圖會以數學公式的形式儲存，公式把點與點連接起來，以繪製直線、曲線、圓形、多邊形等。", "英文定義": "A vector image is stored as mathematical formulae that connect points to draw straight lines, curves, circles, polygons, and other shapes."}, {"工作表名稱": "A1_資訊處理", "課文編號": 3, "課文名稱": "數據表示", "課文章節編號": "3.5", "課文章節名稱": "多媒體", "首次出現頁數": 110, "主要講解頁數": "110", "其他相關頁數": "113–114, 119–120, 125", "中文名稱": "色深", "英文名稱": "colour depth", "中文定義": "色深用於表示一個像素中顏色的位元數；圖像的色深 <script>
const D=JSON.parse(document.getElementById('data').textContent),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let mode='search',source='all',fav=new Set(JSON.parse(localStorage.getItem('ictFav5')||'[]')),recent=JSON.parse(localStorage.getItem('ictRecent5')||'[]');
const N=s=>(s||'').toString().toLowerCase().normalize('NFKC').replace(/\s+/g,' ').trim(), E=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const KB=x=>'B|'+x['工作表名稱']+'|'+x['中文名稱']+'|'+x['英文名稱']+'|'+x['首次出現頁數'], KE=x=>'E|'+x['英文']+'|'+x['中文'];

function termScore(t,q){t=N(t);q=N(q);if(!q)return 1;if(t===q)return 1200;const z=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),r=new RegExp('(^|[^a-z0-9])'+z+'([^a-z0-9]|$)','i');if(r.test(t))return 950;if(q.length>=4&&t.startsWith(q))return 600;if(q.length>=4&&t.includes(q))return 350;return 0}
function defScore(t,q){t=N(t);q=N(q);if(!q||q.length<4)return 0;if(t.includes(q))return 90;return q.split(' ').every(p=>p.length>=2&&t.includes(p))?45:0}
function bookCode(x){return (x['工作表名稱']||'').split('_')[0].toUpperCase()}
function pageNums(s){let out=[];(s||'').toString().replace(/P\./gi,'').split(',').forEach(part=>{let m=part.trim().match(/^(\d+)(?:[–-](\d+))?$/);if(m){let a=+m[1],b=+(m[2]||m[1]);for(let i=a;i<=b&&i<=a+200;i++)out.push(i)}});return out}
function pageMatch(x,q){
 q=N(q).toUpperCase();let m=q.match(/^(?:(A1|A2|B|C1|C2|D1|D2|E)\s*)?(?:P\.?\s*)?(\d+)$/);if(!m)return false;
 if(m[1]&&bookCode(x)!==m[1])return false;let p=+m[2];
 return ['首次出現頁數','主要講解頁數','其他相關頁數'].some(k=>pageNums(x[k]).includes(p))
}
function edbMatches(x){
 const en=N(x['英文名稱']),zh=N(x['中文名稱']);
 let exact=D.edb.filter(e=>N(e['英文'])===en||N(e['中文'])===zh);
 if(exact.length)return exact.slice(0,4);
 if(en)return D.edb.filter(e=>N(e['英文'])&& (N(e['英文']).includes(en)||en.includes(N(e['英文'])))).slice(0,3);
 return []
}
function shortPages(s){
 let a=(s||'').toString().split(',').map(x=>x.trim()).filter(Boolean);
 if(a.length<=6)return {short:a.join(', '),more:false};
 return {short:a.slice(0,6).join(', ')+' …',more:true}
}
function bookCard(x){
 let k=KB(x),main=x['主要講解頁數'],first=x['首次出現頁數'],other=x['其他相關頁數'],em=edbMatches(x),sp=shortPages(other);
 let same=em.some(e=>N(e['中文'])===N(x['中文名稱'])&&N(e['英文'])===N(x['英文名稱']));
 return `<article class="card">
 <div class="top"><div><div class="zh">${E(x['中文名稱'])}</div>${x['英文名稱']?`<div class="en">${E(x['英文名稱'])}</div>`:''}</div><button class="star" data-k="${E(k)}">${fav.has(k)?'★':'☆'}</button></div>
 <div class="badges"><span class="badge">📘 ${E(x['工作表名稱'])}</span>${em.length?`<span class="badge ${same?'edb':'diff'}">${same?'🏛️ 教育局亦有收錄':'📘／🏛️ 用詞有差異'}</span>`:''}</div>
 <div class="pages">
  ${main?`<div class="prow mainp"><div class="plabel">⭐ 主要講解</div><div class="pval">P.${E(main)}</div></div>`:''}
  ${first?`<div class="prow"><div class="plabel">🔹 首次出現</div><div class="pval">P.${E(first)}</div></div>`:''}
  ${other?`<div class="prow otherp"><div class="plabel">🔗 其他相關</div><div class="pval"><span class="pshort">P.${E(sp.short)}</span><span class="pfull hide">P.${E(other)}</span>${sp.more?`<button class="showall" type="button">顯示全部</button>`:''}</div></div>`:''}
 </div>
 ${x['中文定義']?`<div class="def"><small>中文定義</small>${E(x['中文定義'])}</div>`:''}
 ${x['英文定義']?`<div class="def"><small>English definition</small>${E(x['英文定義'])}</div>`:''}
 <div class="loc">${E(x['課文章節編號'])} ${E(x['課文章節名稱'])}${x['課文名稱']?' · '+E(x['課文名稱']):''}</div>
 ${em.length?`<div class="edbbox"><b>🏛️ 教育局用詞</b><br>${em.map(e=>`${E(e['中文'])}${e['英文']?' — '+E(e['英文']):''}`).join('<br>')}</div>`:''}
 </article>`
}
function edbCard(x){let k=KE(x);return `<article class="card"><div class="top"><div><div class="zh">${E(x['中文'])}</div>${x['英文']?`<div class="en">${E(x['英文'])}</div>`:''}</div><button class="star" data-k="${E(k)}">${fav.has(k)?'★':'☆'}</button></div><div class="badges"><span class="badge edb">🏛️ 教育局詞彙</span></div></article>`}
function bind(){
 $$('.star').forEach(b=>b.onclick=()=>{fav.has(b.dataset.k)?fav.delete(b.dataset.k):fav.add(b.dataset.k);localStorage.setItem('ictFav5',JSON.stringify([...fav]));render()});
 $$('.showall').forEach(b=>b.onclick=()=>{let p=b.parentElement;p.querySelector('.pshort').classList.toggle('hide');p.querySelector('.pfull').classList.toggle('hide');b.textContent=b.textContent==='顯示全部'?'收起':'顯示全部'})
}
function search(){
 let q=$('#q').value.trim(),terms=[],defs=[],isPage=/^(?:(A1|A2|B|C1|C2|D1|D2|E)\s*)?(?:P\.?\s*)?\d+$/i.test(q);
 if(q){recent=[q,...recent.filter(x=>x!==q)].slice(0,12);localStorage.setItem('ictRecent5',JSON.stringify(recent))}
 if(source!=='edb')D.textbook.forEach(x=>{
  if(isPage&&pageMatch(x,q)){terms.push({t:'b',x,s:1500});return}
  if(isPage)return;
  let s=Math.max(termScore(x['中文名稱'],q),termScore(x['英文名稱'],q));if(s)terms.push({t:'b',x,s:s+5});else{let d=Math.max(defScore(x['中文定義'],q),defScore(x['英文定義'],q));if(d)defs.push({t:'b',x,s:d})}
 });
 if(source!=='book'&&!isPage)D.edb.forEach(x=>{let s=Math.max(termScore(x['中文'],q),termScore(x['英文'],q));if(s)terms.push({t:'e',x,s})});
 return (terms.length?terms:defs).sort((a,b)=>b.s-a.s).slice(0,q?160:40)
}
function render(){
 let a=[];$('#quizbox').classList.add('hide');$('#results').classList.remove('hide');
 if(mode==='quiz'){renderQuiz();return}
 if(mode==='search')a=search();
 if(mode==='fav'){D.textbook.forEach(x=>fav.has(KB(x))&&a.push({t:'b',x}));D.edb.forEach(x=>fav.has(KE(x))&&a.push({t:'e',x}))}
 if(mode==='recent'){ $('#stats').textContent='最近搜尋';$('#results').innerHTML=recent.length?`<article class="card wide">${recent.map(x=>`<button class="rr">${E(x)}</button>`).join(' ')}</article>`:'<div class="empty">未有最近搜尋。</div>';$$('.rr').forEach(b=>b.onclick=()=>{$('#q').value=b.textContent;setMode('search')});return}
 if(mode==='browse'){let b=$('#book').value,l=$('#lesson').value,c=$('#chapter').value;a=D.textbook.filter(x=>(!b||x['工作表名稱']===b)&&(!l||x['課文編號']==l)&&(!c||x['課文章節編號']==c)).map(x=>({t:'b',x}))}
 $('#stats').textContent=a.length+' 個結果';$('#results').innerHTML=a.length?a.map(o=>o.t==='b'?bookCard(o.x):edbCard(o.x)).join(''):'<div class="empty">找不到相關詞彙。可嘗試中文、英文、縮寫、定義或頁碼。</div>';bind()
}
function setMode(m){mode=m;$$('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$('#sources').classList.toggle('hide',m!=='search');$('#browse').classList.toggle('hide',m!=='browse');render()}
$$('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));$$('[data-s]').forEach(b=>b.onclick=()=>{source=b.dataset.s;$$('[data-s]').forEach(x=>x.classList.toggle('on',x===b));render()});
let tm;$('#q').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>setMode('search'),100)};
const books=[...new Set(D.textbook.map(x=>x['工作表名稱']))];$('#book').innerHTML='<option value="">全部冊別</option>'+books.map(x=>`<option>${E(x)}</option>`).join('');
function lessons(){let b=$('#book').value,a=D.textbook.filter(x=>!b||x['工作表名稱']===b),m=new Map(a.map(x=>[x['課文編號'],x['課文編號']+' '+x['課文名稱']]));$('#lesson').innerHTML='<option value="">全部課文</option>'+[...m].filter(x=>x[0]).map(x=>`<option value="${E(x[0])}">${E(x[1])}</option>`).join('');chapters()}
function chapters(){let b=$('#book').value,l=$('#lesson').value,a=D.textbook.filter(x=>(!b||x['工作表名稱']===b)&&(!l||x['課文編號']==l)),m=new Map(a.map(x=>[x['課文章節編號'],x['課文章節編號']+' '+x['課文章節名稱']]));$('#chapter').innerHTML='<option value="">全部章節</option>'+[...m].filter(x=>x[0]).map(x=>`<option value="${E(x[0])}">${E(x[1])}</option>`).join('');render()}
$('#book').onchange=lessons;$('#lesson').onchange=chapters;$('#chapter').onchange=render;
function renderQuiz(){let p=D.textbook.filter(x=>x['中文名稱']&&x['英文名稱']),q=p[Math.floor(Math.random()*p.length)],ans=q['英文名稱'],opts=[ans];while(opts.length<4){let z=p[Math.floor(Math.random()*p.length)]['英文名稱'];if(z&&!opts.includes(z))opts.push(z)}opts.sort(()=>Math.random()-.5);$('#results').classList.add('hide');let z=$('#quizbox');z.classList.remove('hide');z.innerHTML=`<b>中文 → 英文</b><div class="quizQ">${E(q['中文名稱'])}</div><div class="answers">${opts.map(x=>`<button data-a="${E(x)}">${E(x)}</button>`).join('')}</div><div id="msg" class="stats"></div><button id="next" class="hide">下一題 →</button>`;$$('.answers button').forEach(b=>b.onclick=()=>{let ok=b.dataset.a===ans;b.classList.add(ok?'ok':'bad');$('#msg').textContent=ok?'✓ 正確！':'✗ 正確答案：'+ans;$('#next').classList.remove('hide');$$('.answers button').forEach(x=>x.disabled=true)});$('#next').onclick=renderQuiz}
render();
</script></body></html>
